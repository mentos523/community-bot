name: slack
version: 1.0.0
description: Slack Bot 适配器
author: robbin
platform_type: chat

config_schema:
  bot_token:
    type: string
    required: true
    secret: true
    description: Bot User OAuth Token（xoxb- 开头）
    env_var: SLACK_BOT_TOKEN
  channel_ids:
    type: string
    required: true
    description: 监听的频道 ID，多个用英文逗号分隔（需先把 Bot 拉进频道）
    env_var: SLACK_CHANNEL_IDS

capabilities:
  - fetch_updates
  - fetch_detail
  - reply
