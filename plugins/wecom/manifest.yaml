name: wecom
version: 1.1.0
description: 企业微信适配器（仅发送：官方无消息拉取 API，接收需另配回调 URL 或会话存档）
author: robbin
platform_type: chat  # forum | chat

# 配置项定义（Web 界面据此自动生成配置表单）
config_schema:
  corp_id:
    type: string
    required: true
    description: 企业 ID（CorpID）
    env_var: WECOM_CORP_ID
  corp_secret:
    type: string
    required: true
    secret: true
    description: 应用 Secret
    env_var: WECOM_CORP_SECRET
  agent_id:
    type: string
    required: true
    description: 应用 AgentID
    env_var: WECOM_AGENT_ID

capabilities:
  # 注意：企业微信官方没有拉取消息的 API，故不声明 fetch_updates（仅发送）
  - fetch_detail
  - reply
