name: telegram
version: 1.0.0
description: Telegram Bot 适配器
author: robbin
platform_type: chat

config_schema:
  bot_token:
    type: string
    required: true
    secret: true
    description: BotFather 申请的 Bot Token
    env_var: TELEGRAM_BOT_TOKEN
  chat_id:
    type: string
    required: false
    description: 默认目标群组/频道 ID（留空则监听所有）
  # 注意：当前仅实现长轮询（polling）模式，webhook 模式暂未实现

capabilities:
  - fetch_updates
  - fetch_detail
  - reply
