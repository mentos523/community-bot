name: vanilla
version: 1.0.0
description: Vanilla Forums 适配器
author: robbin
platform_type: forum  # forum | chat

# 配置项定义（Web 界面据此自动生成配置表单）
config_schema:
  url:
    type: string
    required: true
    description: 论坛地址，如 https://example.com
  api_token:
    type: string
    required: true
    secret: true
    description: Vanilla API v2 Token
    env_var: VANILLA_API_TOKEN
  category_id:
    type: string
    required: false
    default: ""
    description: 分类 ID（留空则全站）

capabilities:
  - fetch_updates
  - fetch_detail
  - reply
